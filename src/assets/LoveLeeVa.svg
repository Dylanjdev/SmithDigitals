<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">LoveLeeVa brand illustration</title>
  <desc id="description">Layered Appalachian mountains, a growing plant, and the words LoveLeeVa and We Grow Our Own.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ead7"/>
      <stop offset="1" stop-color="#e5cfaa"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48664a"/>
      <stop offset="1" stop-color="#244634"/>
    </linearGradient>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M8 26c18-12 35-12 52 0s33 12 49 0" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
      <path d="M-18 72c18-12 35-12 52 0s33 12 49 0 33-12 49 0" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="935" cy="204" r="92" fill="#d29a4a" opacity=".9"/>
  <path d="M0 492 174 328l107 103 156-173 178 196 128-126 119 117 160-194 178 205v236H0Z" fill="#78906a"/>
  <path d="M0 568 201 399l137 102 162-150 169 176 156-133 173 139 202-177v336H0Z" fill="url(#ridge)"/>
  <path d="M0 647c168-79 307-98 418-56 104 39 178 32 277-5 151-57 313-37 505 61v253H0Z" fill="#183b2c"/>
  <path d="M0 0h1200v900H0z" fill="url(#grain)"/>

  <g transform="translate(92 84)">
    <path d="M50 85C22 61 18 31 26 3c31 10 53 30 55 61 1 8 0 15-2 22" fill="#ad603f"/>
    <path d="M82 86c-3-33 13-60 44-77 13 28 11 56-13 79" fill="#d29a4a"/>
    <path d="M78 118V64" fill="none" stroke="#183b2c" stroke-linecap="round" stroke-width="12"/>
  </g>

  <g fill="#f8f1e5" transform="translate(92 626)">
    <text y="76" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" letter-spacing="-4">LoveLeeVa</text>
    <text y="128" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="8">WE GROW OUR OWN</text>
  </g>

  <g transform="translate(90 803)" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">
    <text fill="#f8f1e5">GOODS</text>
    <circle cx="128" cy="-6" r="4" fill="#d29a4a"/>
    <text x="154" fill="#f8f1e5">POWER</text>
    <circle cx="282" cy="-6" r="4" fill="#d29a4a"/>
    <text x="308" fill="#f8f1e5">TALENT</text>
    <circle cx="448" cy="-6" r="4" fill="#d29a4a"/>
    <text x="474" fill="#f8f1e5">ADVENTURE</text>
  </g>
</svg>
